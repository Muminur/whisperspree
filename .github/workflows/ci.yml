name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    name: GATE (PRD §15.2 / §17.5)
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        node: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify attribution metadata
        if: github.event_name != 'pull_request'
        run: scripts/check_ci_attribution.sh "${GITHUB_EVENT_NAME}" "${GITHUB_EVENT_PATH}" "${GITHUB_WORKSPACE}"

      - name: Secret staged raw-blob policy
        if: github.event_name != 'pull_request'
        run: scripts/check_ci_staged_policy.sh "${GITHUB_EVENT_NAME}" "${GITHUB_EVENT_PATH}" "${GITHUB_WORKSPACE}" --exceptions .repo-policy-secret-exceptions.json

      - name: Repository-policy remediation regressions
        run: PYTHONDONTWRITEBYTECODE=1 GIT_CONFIG_GLOBAL=/dev/null sh testutil/repo_policy/test_t0_0_remediation.sh

      # pnpm/action-setup MUST run before setup-node so `cache: pnpm` works.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.0

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: cargo-llvm-cov

      - name: Install frontend dependencies
        run: pnpm i --frozen-lockfile

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm test
        run: pnpm test

      - name: Frontend coverage (enforced ≥85%)
        run: pnpm exec vitest run --coverage

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: cargo clippy -D warnings
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Enforced from T0.2 (TASKS.md M0 override): the first real Rust code lands
      # here, so line coverage must stay ≥85%. The ignore set is the LOOP §2.1
      # OS-glue modules plus the T0.2 addendum — `lib.rs` (tauri builder/tray GUI
      # bootstrap) and `main.rs` (bin shim), which are GUI/process glue not
      # exercisable headless.
      - name: Coverage (enforced ≥85% lines)
        run: cargo llvm-cov --manifest-path src-tauri/Cargo.toml --fail-under-lines 85 --ignore-filename-regex '(^|/)(hotkey/|inject/macos|context/macos|audio/capture)|(^|/)(lib\.rs|main\.rs)$'

      - name: Hygiene gates
        run: |
          set -uo pipefail
          fail=0
          if grep -rnI --exclude-dir=target "danger_accept_invalid_certs" src-tauri/src src 2>/dev/null; then
            echo "::error::danger_accept_invalid_certs is forbidden (P-8)"; fail=1
          fi
          if grep -rn "std::process::Command" src-tauri/src 2>/dev/null; then
            echo "::error::std::process::Command is forbidden in src-tauri/src"; fail=1
          fi
          if grep -rnE 'println!|eprintln!|dbg!' src-tauri/src 2>/dev/null; then
            echo "::error::println!/eprintln!/dbg! are forbidden in src-tauri/src (use tracing)"; fail=1
          fi
          if grep -rnE 'eval\(|new Function\(|dangerouslySetInnerHTML' src 2>/dev/null; then
            echo "::error::eval / new Function / dangerouslySetInnerHTML are forbidden in src/"; fail=1
          fi
          # Governance docs must never be tracked (LOOP §1.2). Empty grep = pass.
          if git ls-files | grep -E '^(AGENTS|CLAUDE|PLANNING|TASKS|PRD|LOOP|Loop)\.md$|^docs/PRD\.md$|^idea\.txt$'; then
            echo "::error::governance docs must not be committed (LOOP §1.2)"; fail=1
          fi
          exit $fail

      - name: Playwright E2E (when present)
        run: |
          if [ -d e2e ]; then
            pnpm exec playwright install chromium
            pnpm e2e
          else
            echo "e2e not present yet — skipped"
          fi

  live-smoke:
    name: Live smoke (opt-in, secret-gated)
    runs-on: macos-14
    env:
      HAS_DG: ${{ secrets.WHISPERSPREE_LIVE_DG_KEY }}
    steps:
      - name: Report live-provider availability
        run: |
          if [ -n "${HAS_DG}" ]; then
            echo "Deepgram secret present — live smoke wiring arrives with T3.1."
          else
            echo "no secrets — skipped"
          fi

  build:
    name: Build dmg (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    needs: gate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: pnpm
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"
      - name: Install frontend dependencies
        run: pnpm i --frozen-lockfile
      - name: Build release dmg
        run: pnpm tauri build
